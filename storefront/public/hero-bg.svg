<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <radialGradient id="bg" cx="60%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFF5EE"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Subtle leaf shapes — top right cluster -->
  <g opacity="0.06" fill="#2E7D32">
    <ellipse cx="680" cy="60" rx="22" ry="48" transform="rotate(-30 680 60)"/>
    <ellipse cx="720" cy="90" rx="18" ry="42" transform="rotate(-50 720 90)"/>
    <ellipse cx="650" cy="100" rx="14" ry="36" transform="rotate(-10 650 100)"/>
    <ellipse cx="740" cy="130" rx="20" ry="44" transform="rotate(-70 740 130)"/>
    <ellipse cx="700" cy="150" rx="16" ry="38" transform="rotate(-25 700 150)"/>
  </g>

  <!-- Bottom left botanical cluster -->
  <g opacity="0.05" fill="#388E3C">
    <ellipse cx="60" cy="500" rx="20" ry="50" transform="rotate(20 60 500)"/>
    <ellipse cx="100" cy="520" rx="16" ry="40" transform="rotate(40 100 520)"/>
    <ellipse cx="30" cy="540" rx="14" ry="36" transform="rotate(5 30 540)"/>
    <ellipse cx="130" cy="480" rx="18" ry="44" transform="rotate(60 130 480)"/>
  </g>

  <!-- Scattered dots — spring pollen feel -->
  <g opacity="0.08" fill="#E8650A">
    <circle cx="420" cy="80" r="3"/>
    <circle cx="560" cy="140" r="2"/>
    <circle cx="180" cy="200" r="3"/>
    <circle cx="340" cy="50" r="2"/>
    <circle cx="490" cy="520" r="3"/>
    <circle cx="150" cy="430" r="2"/>
    <circle cx="620" cy="460" r="3"/>
    <circle cx="280" cy="560" r="2"/>
  </g>

  <!-- Thin organic curves — branches -->
  <g opacity="0.04" stroke="#2E7D32" stroke-width="1.5" fill="none">
    <path d="M 750 0 Q 720 80 680 120 Q 650 160 640 200"/>
    <path d="M 780 20 Q 760 100 730 150 Q 710 180 700 220"/>
    <path d="M 0 580 Q 40 520 80 480 Q 120 440 140 400"/>
  </g>
</svg>