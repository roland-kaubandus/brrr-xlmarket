<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  header { margin-bottom: 2.5rem; }
  h1 { font-size: 1.6rem; font-weight: 700; color: #0F1B2D; letter-spacing: -0.03em; }

  .subtitle { font-size: 0.82rem; color: #888; margin-top: 0.3rem; }

  .bar { display: flex; gap: 1.5rem; margin: 1.4rem 0; flex-wrap: wrap; }
  .bar-item { display: flex; align-items: center; gap: 0.35rem; font-size: 0.75rem; color: #666; }
  .bar-dot { width: 7px; height: 7px; border-radius: 50%; }

  .stats { display: flex; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
  .stat { border: 1px solid #e5e7eb; border-radius: 8px; padding: 0.7rem 1rem; background: #fff; }
  .stat b { font-size: 1.3rem; color: #E8650A; display: block; }
  .stat small { font-size: 0.7rem; color: #999; }

  .controls { display: flex; gap: 0.4rem; margin-bottom: 1.2rem; }
  .controls button { background: #fff; color: #555; border: 1px solid #ddd; padding: 0.35rem 0.9rem; border-radius: 5px; cursor: pointer; font-size: 0.78rem; font-family: inherit; transition: all 0.15s; }
  .controls button:hover { background: #f0f0f0; border-color: #bbb; }

  /* L1 */
  .l1 { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; margin-bottom: 0.5rem; }
  .l1 > summary { display: flex; align-items: center; gap: 0.7rem; padding: 0.75rem 1rem; cursor: pointer; user-select: none; list-style: none; }
  .l1 > summary::-webkit-details-marker { display: none; }
  .l1 > summary::before { content: ''; width: 0; height: 0; border-left: 5px solid #E8650A; border-top: 4px solid transparent; border-bottom: 4px solid transparent; flex-shrink: 0; transition: transform 0.15s; }
  .l1[open] > summary::before { transform: rotate(90deg); }
  .l1:hover { border-color: #E8650A30; }
  .l1-num { font-size: 0.7rem; color: #bbb; font-weight: 600; min-width: 20px; }
  .l1-name { font-size: 0.95rem; font-weight: 700; color: #0F1B2D; flex: 1; }
  .l1-buyer { font-size: 0.7rem; color: #aaa; }
  .l1-count { font-size: 0.68rem; color: #999; background: #f5f5f5; padding: 0.15rem 0.5rem; border-radius: 4px; }
  .tag { font-size: 0.62rem; font-weight: 600; padding: 0.1rem 0.4rem; border-radius: 3px; }
  .tag-new { background: #ecfdf5; color: #059669; }
  .tag-merged { background: #f5f3ff; color: #7c3aed; }
  .tag-priority { background: #fff7ed; color: #E8650A; }

  /* L2 */
  .l2-wrap { padding: 0.3rem 0.8rem 0.7rem 1.6rem; display: flex; flex-direction: column; gap: 0.2rem; }
  details.l2 { border: 1px solid #f0f0f0; border-radius: 7px; background: #fafbfc; }
  details.l2 > summary { display: flex; align-items: baseline; gap: 0.5rem; padding: 0.45rem 0.8rem; cursor: pointer; user-select: none; list-style: none; }
  details.l2 > summary::-webkit-details-marker { display: none; }
  details.l2 > summary::before { content: ''; width: 0; height: 0; border-left: 4px solid #3b82f6; border-top: 3px solid transparent; border-bottom: 3px solid transparent; flex-shrink: 0; transition: transform 0.15s; }
  details.l2[open] > summary::before { transform: rotate(90deg); }
  .l2-name { font-size: 0.84rem; font-weight: 600; color: #1e40af; }
  .l2-note { font-size: 0.7rem; color: #ef4444; font-weight: 500; background: #fef2f2; padding: 0.05rem 0.4rem; border-radius: 3px; }

  /* L3 */
  .l3-wrap { padding: 0.25rem 0.6rem 0.5rem 1.1rem; display: flex; flex-direction: column; gap: 0.15rem; }
  details.l3 { border: 1px solid #f0f0f0; border-radius: 5px; background: #f7f8fa; }
  details.l3 > summary { display: flex; align-items: baseline; gap: 0.4rem; padding: 0.35rem 0.7rem; cursor: pointer; user-select: none; list-style: none; font-size: 0.8rem; }
  details.l3 > summary::-webkit-details-marker { display: none; }
  details.l3 > summary::before { content: ''; width: 0; height: 0; border-left: 3px solid #22c55e; border-top: 2.5px solid transparent; border-bottom: 2.5px solid transparent; flex-shrink: 0; transition: transform 0.15s; }
  details.l3[open] > summary::before { transform: rotate(90deg); }
  .l3-name { color: #15803d; font-weight: 500; }
  .l3-leaf { padding: 0.3rem 0.7rem 0.3rem 1.5rem; font-size: 0.8rem; color: #16a34a; }
  .l3-leaf::before { content: ''; display: inline-block; width: 4px; height: 4px; background: #bbf7d0; border-radius: 50%; margin-right: 0.5rem; vertical-align: middle; }

  /* L4 */
  .l4-wrap { padding: 0.2rem 0.4rem 0.4rem 0.9rem; }
  .l4-item { padding: 0.2rem 0.5rem; font-size: 0.76rem; color: #7c3aed; }
  .l4-item::before { content: ''; display: inline-block; width: 3px; height: 3px; background: #ddd6fe; border-radius: 50%; margin-right: 0.4rem; vertical-align: middle; }

  /* Duplicate table */
  .section-title { font-size: 1.1rem; font-weight: 700; color: #0F1B2D; margin: 2.5rem 0 0.7rem; padding-bottom: 0.3rem; border-bottom: 2px solid #E8650A; display: inline-block; }
  table { width: 100%; border-collapse: collapse; margin: 0.8rem 0 2rem; font-size: 0.8rem; background: #fff; border-radius: 8px; overflow: hidden; border: 1px solid #e5e7eb; }
  th { text-align: left; padding: 0.55rem 0.8rem; font-size: 0.72rem; color: #666; text-transform: uppercase; letter-spacing: 0.04em; background: #f9fafb; border-bottom: 1px solid #e5e7eb; }
  td { padding: 0.4rem 0.8rem; border-bottom: 1px solid #f3f4f6; }
  .owner { color: #1e40af; font-weight: 600; }
  .not-in { color: #dc2626; text-decoration: line-through; opacity: 0.5; }

  @media (max-width: 640px) {
    body { padding: 1.2rem 0.8rem 3rem; }
    .stats { gap: 0.5rem; }
    .stat { padding: 0.5rem 0.7rem; }
    .l1 > summary { padding: 0.6rem 0.7rem; }
    .l1-buyer { display: none; }
  }
</style>

function render(){const t=document.getElementById('tree');let h='';
