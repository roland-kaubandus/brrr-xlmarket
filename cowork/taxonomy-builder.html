<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', system-ui, sans-serif; background: #f4f5f7; color: #1a1a1a; height: 100vh; overflow: hidden; }

/* Header */
.hdr { background: #0F1B2D; color: #fff; padding: 10px 20px; display: flex; align-items: center; gap: 16px; }
.hdr h1 { font-size: 1rem; font-weight: 700; flex-shrink: 0; }
.hdr h1 span { color: #E8650A; }
.hdr .pills { display: flex; gap: 6px; flex: 1; flex-wrap: wrap; }
.pill { font-size: 0.7rem; padding: 3px 10px; border-radius: 4px; }
.pill-ok { background: #065f46; color: #6ee7b7; }
.pill-todo { background: #92400e; color: #fcd34d; }
.pill-total { background: rgba(255,255,255,0.1); color: #94a3b8; }
.hdr-btns { display: flex; gap: 6px; flex-shrink: 0; }
.hdr-btns button { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); color: #e2e8f0; padding: 5px 12px; border-radius: 5px; cursor: pointer; font-size: 0.75rem; font-family: inherit; }
.hdr-btns button:hover { background: rgba(255,255,255,0.15); }
.hdr-btns button.primary { background: #E8650A; border-color: #E8650A; color: #fff; font-weight: 600; }

/* Layout */
.layout { display: flex; height: calc(100vh - 44px); }

/* Left — unsorted */
.left { width: 340px; flex-shrink: 0; background: #fff; border-right: 1px solid #e5e7eb; display: flex; flex-direction: column; }
.left-top { padding: 12px 14px 8px; border-bottom: 1px solid #f0f0f0; }
.left-top h2 { font-size: 0.82rem; font-weight: 700; color: #0F1B2D; }
.left-top .sub { font-size: 0.7rem; color: #999; margin-top: 2px; }
.search { width: 100%; padding: 7px 10px; border: 1px solid #e5e7eb; border-radius: 5px; font-size: 0.8rem; font-family: inherit; margin-top: 8px; }
.search:focus { outline: none; border-color: #E8650A; }
.left-list { flex: 1; overflow-y: auto; padding: 6px 10px; }

/* Right — categories */
.right { flex: 1; overflow-y: auto; padding: 12px; }
.cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; align-content: start; }

/* Item chip */
.chip {
  display: flex; align-items: center; gap: 6px; padding: 5px 10px; margin-bottom: 4px;
  background: #fff; border: 1px solid #e8e8e8; border-radius: 5px; font-size: 0.78rem;
  cursor: grab; user-select: none; transition: border-color 0.1s, box-shadow 0.1s;
}
.chip:hover { border-color: #E8650A; }
.chip.dragging { opacity: 0.3; }
.chip .grip { color: #d0d0d0; font-size: 0.65rem; cursor: grab; }
.chip .cn { flex: 1; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip .cc { font-size: 0.68rem; color: #999; background: #f5f5f5; padding: 1px 5px; border-radius: 3px; flex-shrink: 0; }
.chip .xx { color: #ccc; cursor: pointer; padding: 0 3px; font-size: 0.8rem; flex-shrink: 0; }
.chip .xx:hover { color: #ef4444; }
.chip.auto { border-left: 3px solid #22c55e; }

/* Category card */
.ccard { background: #fff; border: 2px solid #e5e7eb; border-radius: 8px; overflow: hidden; }
.ccard.drag-over { border-color: #E8650A; background: #fffaf5; }
.ccard-head { padding: 8px 12px; background: #fafbfc; border-bottom: 1px solid #f0f0f0; display: flex; align-items: center; gap: 6px; }
.ccard-head .cnum { font-size: 0.65rem; color: #bbb; font-weight: 700; }
.ccard-head .cname { font-size: 0.82rem; font-weight: 700; color: #0F1B2D; flex: 1; }
.ccard-head .cbadge { font-size: 0.65rem; background: #E8650A; color: #fff; padding: 1px 7px; border-radius: 3px; font-weight: 600; }
.ccard-head .cprods { font-size: 0.65rem; color: #999; }
.ccard-body { padding: 6px 8px; min-height: 40px; max-height: 300px; overflow-y: auto; }
.ccard-body:empty::after { content: 'Lohista siia'; color: #d0d0d0; font-size: 0.75rem; display: block; text-align: center; padding: 10px; }

/* Toast */
.toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: #0F1B2D; color: #fff; padding: 8px 20px; border-radius: 6px; font-size: 0.82rem; z-index: 999; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
.toast.show { opacity: 1; }

function autoSuggest(name) {
  for (const [catId, regex] of autoRules) {
    if (regex.test(name)) return catId;
  }
  return null;
}

function autoMap() {
  let count = 0;
  for (const [name] of ALL_CATS) {
    if (!mapping[name]) {
      const s = autoSuggest(name);
      if (s) { mapping[name] = s; count++; }
    }
  }
  toast(count + ' auto-mapped');
  save(); renderAll();
}

function clearAll() {
  if (!confirm('Tühjendada kõik mappingud?')) return;
  mapping = {};
  save(); renderAll();
}

// Drag state
let dragName = null;

function renderLeft() {
  const q = document.getElementById('searchBox').value.toLowerCase();
  const unmapped = ALL_CATS.filter(([name]) => !mapping[name] && name.toLowerCase().includes(q));
  document.getElementById('leftCount').textContent = `(${unmapped.length})`;
  const el = document.getElementById('leftList');
  el.innerHTML = unmapped.map(([name, count]) => {
    const sug = autoSuggest(name);
    return `<div class="chip${sug ? ' auto' : ''}" draggable="true" data-name="${esc(name)}">
      <span class="grip">⠿</span>
      <span class="cn" title="${esc(name)}">${esc(name)}</span>
      <span class="cc">${count}</span>
    </div>`;
  }).join('');
  attachLeftDrag();
}

function renderRight() {
  const el = document.getElementById('catGrid');
  el.innerHTML = L1.map(cat => {
    const items = ALL_CATS.filter(([name]) => mapping[name] === cat.id);
    const prodCount = items.reduce((s, [, c]) => s + c, 0);
    return `<div class="ccard" data-cat="${cat.id}">
      <div class="ccard-head">
        <span class="cnum">${String(cat.id).padStart(2,'0')}</span>
        <span class="cname">${cat.name}</span>
        ${items.length ? `<span class="cbadge">${items.length}</span>` : ''}
        ${prodCount ? `<span class="cprods">${prodCount} prod</span>` : ''}
      </div>
      <div class="ccard-body" data-cat="${cat.id}">
        ${items.map(([name, count]) => `<div class="chip" draggable="true" data-name="${esc(name)}">
          <span class="grip">⠿</span>
          <span class="cn" title="${esc(name)}">${esc(name)}</span>
          <span class="cc">${count}</span>
          <span class="xx" onclick="unmap('${esc(name)}')">×</span>
        </div>`).join('')}
      </div>
    </div>`;
  }).join('');
  attachRightDrag();
}

function renderStats() {
  const mapped = ALL_CATS.filter(([n]) => mapping[n]).length;
  const unmapped = ALL_CATS.length - mapped;
  const prods = ALL_CATS.filter(([n]) => mapping[n]).reduce((s, [, c]) => s + c, 0);
  document.getElementById('pOk').textContent = mapped + ' mapped';
  document.getElementById('pTodo').textContent = unmapped + ' unmapped';
  document.getElementById('pProds').textContent = prods + ' products';
}

function renderAll() { renderLeft(); renderRight(); renderStats(); }

function unmap(name) { delete mapping[name]; save(); renderAll(); }

function attachLeftDrag() {
  document.querySelectorAll('.left-list .chip').forEach(el => {
    el.addEventListener('dragstart', e => { dragName = e.target.dataset.name; e.target.classList.add('dragging'); });
    el.addEventListener('dragend', e => { e.target.classList.remove('dragging'); clearDragOver(); });
  });
}

function attachRightDrag() {
  // Items in categories — draggable back or to other cats
  document.querySelectorAll('.ccard-body .chip').forEach(el => {
    el.addEventListener('dragstart', e => { dragName = e.target.dataset.name; e.target.classList.add('dragging'); });
    el.addEventListener('dragend', e => { e.target.classList.remove('dragging'); clearDragOver(); });
  });
  // Drop zones
  document.querySelectorAll('.ccard-body').forEach(el => {
    el.addEventListener('dragover', e => { e.preventDefault(); el.parentElement.classList.add('drag-over'); });
    el.addEventListener('dragleave', () => { el.parentElement.classList.remove('drag-over'); });
    el.addEventListener('drop', e => {
      e.preventDefault(); el.parentElement.classList.remove('drag-over');
      if (dragName) { mapping[dragName] = parseInt(el.dataset.cat); dragName = null; save(); renderAll(); }
    });
  });
  // Drop back to unsorted
  document.getElementById('leftList').addEventListener('dragover', e => e.preventDefault());
  document.getElementById('leftList').addEventListener('drop', e => {
    e.preventDefault();
    if (dragName) { delete mapping[dragName]; dragName = null; save(); renderAll(); }
  });
}

function clearDragOver() { document.querySelectorAll('.ccard').forEach(c => c.classList.remove('drag-over')); }

function exportMapping() {
  const result = {};
  for (const cat of L1) {
    result[cat.name] = ALL_CATS.filter(([n]) => mapping[n] === cat.id).map(([n, c]) => ({ name: n, products: c }));
  }
  result._unmapped = ALL_CATS.filter(([n]) => !mapping[n]).map(([n, c]) => ({ name: n, products: c }));
  result._stats = {
    totalCategories: ALL_CATS.length,
    mapped: ALL_CATS.filter(([n]) => mapping[n]).length,
    unmapped: ALL_CATS.filter(([n]) => !mapping[n]).length,
    totalProducts: ALL_CATS.reduce((s, [, c]) => s + c, 0),
    mappedProducts: ALL_CATS.filter(([n]) => mapping[n]).reduce((s, [, c]) => s + c, 0),
  };
  const blob = new Blob([JSON.stringify(result, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'xlmarket-category-mapping.json';
  a.click();
  toast('JSON exported');
}

function save() { try { localStorage.setItem('xlm-mapping', JSON.stringify(mapping)); } catch(e) {} }
function load() { try { const s = localStorage.getItem('xlm-mapping'); if (s) mapping = JSON.parse(s); } catch(e) {} }

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function esc(s) { return s.replace(/'/g, '&#39;').replace(/"/g, '&quot;'); }

// Boot
load();
renderAll();
</script>
