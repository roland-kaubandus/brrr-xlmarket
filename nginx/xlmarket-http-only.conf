# xlmarket.eu — HTTP-only config (enne SSL certifikaadi hankimist)
# Kasuta seda kui DNS pole veel seadistatud või certbot pole käivitatud
# Installimine: sudo cp nginx/xlmarket-http-only.conf /etc/nginx/sites-enabled/xlmarket.eu

server {
    listen 80;
    listen 8090;
    server_name xlmarket.eu www.xlmarket.eu _;

    root /var/www/html;

    location /.well-known/ {
        try_files $uri =404;
    }

    # Medusa backend API
    location /store/ {
        limit_req zone=store_api burst=40 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:9001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:9001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /app {
        proxy_pass http://127.0.0.1:9001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /auth/ {
        limit_req zone=auth_api burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:9001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://127.0.0.1:9001;
    }

    location = /sitemap.xml {
        alias /home/brrr/brrr-xlmarket/data/feeds/sitemap.xml;
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }

    location = /robots.txt {
        alias /home/brrr/brrr-xlmarket/storefront/public/robots.txt;
        expires 1d;
    }

    location /feeds/ {
        alias /home/brrr/brrr-xlmarket/data/feeds/;
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3030;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        limit_req zone=storefront burst=60 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3030;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
