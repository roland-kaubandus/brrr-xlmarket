# Rate limiting zones for xlmarket.eu
# Install: sudo cp /home/brrr/brrr-xlmarket/nginx/rate-limit.conf /etc/nginx/conf.d/xlmarket-rate-limit.conf

# Store API: 20 req/sec per IP, 10MB zone (~160k IPs)
limit_req_zone $binary_remote_addr zone=store_api:10m rate=20r/s;

# Auth endpoints: 5 req/sec per IP (brute force protection)
limit_req_zone $binary_remote_addr zone=auth_api:10m rate=5r/s;

# General storefront: 30 req/sec per IP
limit_req_zone $binary_remote_addr zone=storefront:10m rate=30r/s;
