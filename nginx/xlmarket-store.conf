# xlmarket.store — arenduskeskkond koodiga "lendame"

server {
    listen 80;
    server_name xlmarket.store www.xlmarket.store;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://xlmarket.store$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.xlmarket.store;

    ssl_certificate /etc/letsencrypt/live/xlmarket.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xlmarket.store/privkey.pem;

    return 301 https://xlmarket.store$request_uri;
}

server {
    listen 443 ssl;
    server_name xlmarket.store;

    ssl_certificate /etc/letsencrypt/live/xlmarket.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xlmarket.store/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Robots-Tag "noindex, nofollow" always;

    root /var/www/html;

    # Robots — block everything
    location = /robots.txt {
        return 200 "User-agent: *\nDisallow: /\n";
        add_header Content-Type text/plain;
    }

    # ACME
    location /.well-known/ {
        try_files $uri =404;
    }

    # Gate page — always accessible
    location = /gate {
        try_files /gate.html =404;
    }

    # Medusa API — no gate needed (storefront JS calls these)
    location /store/ {
        proxy_pass http://127.0.0.1:9001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:9001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /app {
        proxy_pass http://127.0.0.1:9001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /auth/ {
        proxy_pass http://127.0.0.1:9001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://127.0.0.1:9001;
    }

    # Media files
    location /media/ {
        alias /var/www/xlmarket-media/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    # Feeds
    location /feeds/ {
        alias /home/brrr/brrr-xlmarket/data/feeds/;
        expires 1h;
    }

    location = /sitemap.xml {
        alias /home/brrr/brrr-xlmarket/data/feeds/sitemap.xml;
        expires 1h;
    }

    # Next.js static (no gate)
    location /_next/ {
        proxy_pass http://127.0.0.1:3030;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Everything else — gate check
    location / {
        # Check gate cookie
        if ($cookie_xlm_gate != "lendame2026") {
            rewrite ^ /gate last;
        }

        proxy_pass http://127.0.0.1:3030;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
