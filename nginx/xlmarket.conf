# xlmarket.eu nginx config
# Esialgu IP-based, hiljem domeeniga
# Installimine: sudo ln -s /home/brrr/brrr-xlmarket/nginx/xlmarket.conf /etc/nginx/sites-enabled/xlmarket.eu

server {
    # Esialgu port-based, domeeni lisame hiljem
    # server_name xlmarket.eu www.xlmarket.eu;
    listen 8090;

    root /var/www/html;

    location /.well-known/ {
        try_files $uri =404;
    }

    # Medusa backend API (store + admin API)
    location /store/ {
        proxy_pass http://127.0.0.1:9001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:9001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Medusa admin dashboard (built-in UI at /app)
    location /app {
        proxy_pass http://127.0.0.1:9001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Medusa health check
    location /health {
        proxy_pass http://127.0.0.1:9001;
    }

    # XML/product feeds (static files)
    location /feeds/ {
        alias /home/brrr/brrr-xlmarket/data/feeds/;
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }

    # Next.js storefront (default)
    location / {
        proxy_pass http://127.0.0.1:3030;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
