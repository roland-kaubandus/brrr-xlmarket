# xlmarket.eu — production nginx config
# SSL cert: Let's Encrypt (certbot)
# Installimine: sudo ln -s /home/brrr/brrr-xlmarket/nginx/xlmarket.conf /etc/nginx/sites-enabled/xlmarket.eu

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name xlmarket.eu www.xlmarket.eu;

    # ACME challenge for certbot renewal
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://xlmarket.eu$request_uri;
    }
}

# www → non-www redirect (HTTPS)
server {
    listen 443 ssl;
    server_name www.xlmarket.eu;

    ssl_certificate /etc/letsencrypt/live/xlmarket.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xlmarket.eu/privkey.pem;

    return 301 https://xlmarket.eu$request_uri;
}

# Main server block
server {
    listen 443 ssl;
    listen 8090; # backwards compatible fallback
    server_name xlmarket.eu;

    # SSL
    ssl_certificate /etc/letsencrypt/live/xlmarket.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xlmarket.eu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    root /var/www/html;

    # ACME challenge
    location /.well-known/ {
        try_files $uri =404;
    }

    # Medusa backend API (store + admin API)
    location /store/ {
        limit_req zone=store_api burst=40 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:9001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:9001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Medusa admin dashboard (built-in UI at /app)
    location /app {
        proxy_pass http://127.0.0.1:9001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Medusa auth endpoints (strict rate limit)
    location /auth/ {
        limit_req zone=auth_api burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:9001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Medusa health check
    location /health {
        proxy_pass http://127.0.0.1:9001;
    }

    # Sitemap
    location = /sitemap.xml {
        alias /home/brrr/brrr-xlmarket/data/feeds/sitemap.xml;
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }

    # robots.txt
    location = /robots.txt {
        alias /home/brrr/brrr-xlmarket/storefront/public/robots.txt;
        expires 1d;
    }

    # XML/product feeds
    location /feeds/ {
        alias /home/brrr/brrr-xlmarket/data/feeds/;
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }

    # Product media (pildid, PDF-id)
    location /media/ {
        alias /var/www/xlmarket-media/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
        gzip_static on;
    }

    # Static assets caching
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3030;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Next.js storefront (default)
    location / {
        limit_req zone=storefront burst=60 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3030;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
