version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: xlmarket-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:5435:5432"
    environment:
      POSTGRES_USER: xlmarket
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: xlmarket
    volumes:
      - xlmarket_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xlmarket"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: xlmarket-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - xlmarket_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  medusa:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: xlmarket-medusa
    restart: unless-stopped
    ports:
      - "127.0.0.1:9001:9000"
    environment:
      DATABASE_URL: postgres://xlmarket:${POSTGRES_PASSWORD}@db:5432/xlmarket
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}
      NODE_ENV: production
      STORE_CORS: http://localhost:3030,https://xlmarket.eu
      ADMIN_CORS: http://localhost:3030,http://localhost:9001,https://xlmarket.eu
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Medusa 2.0 admin panel is built-in at /app — no separate admin service needed

  storefront:
    build:
      context: ./storefront
      dockerfile: Dockerfile
    container_name: xlmarket-storefront
    restart: unless-stopped
    ports:
      - "127.0.0.1:3030:3000"
    environment:
      NEXT_PUBLIC_MEDUSA_URL: http://medusa:9000
      NEXT_PUBLIC_MEDUSA_KEY: ${NEXT_PUBLIC_MEDUSA_KEY}
      NEXT_PUBLIC_REGION_ID: ${NEXT_PUBLIC_REGION_ID}
      NEXT_PUBLIC_BASE_URL: https://xlmarket.eu
      NEXT_PUBLIC_DEFAULT_REGION: ee
    depends_on:
      medusa:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  xlmarket_pgdata:
  xlmarket_redis:
