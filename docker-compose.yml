# XLMarket — Coolify-ready Docker Compose
#
# Coolify auto-injects:
#   - Traefik labels for HTTP routing (set Domains in Coolify UI per service)
#   - Persistent volumes for named volumes
#   - Internal network bridging
#
# Required environment variables (set in Coolify UI -> Environment Variables):
#   POSTGRES_PASSWORD       Strong random string for Postgres
#   JWT_SECRET              Random 32+ chars
#   COOKIE_SECRET           Random 32+ chars
#   MEILI_MASTER_KEY        Random 32+ chars (Meili master key)
#   MEILISEARCH_API_KEY     Same value as MEILI_MASTER_KEY (legacy alias used by Medusa plugin)
#   NEXT_PUBLIC_MEDUSA_KEY  pk_... (created via Medusa Admin -> Settings -> Publishable API Keys)
#   NEXT_PUBLIC_REGION_ID   reg_... (Medusa region)
#   NEXT_PUBLIC_BASE_URL    https://xlmarket.ee (or staging URL)
#   NEXT_PUBLIC_MEILI_URL   https://meili.xlmarket.ee  (Coolify-exposed Meili domain)
#   NEXT_PUBLIC_MEILI_KEY   Search-only key (generate after first Meili boot via /keys API)
#   STORE_CORS              https://xlmarket.ee
#   ADMIN_CORS              https://xlmarket.ee,https://admin.xlmarket.ee
#   AUTH_CORS               https://xlmarket.ee

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: xlmarket
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: xlmarket
    volumes:
      - xlmarket_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xlmarket -d xlmarket"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - xlmarket_redis:/data
    # NB: unikaalne alias, sest medusa on KA mailcow-võrgus, kus on oma 'redis'
    # alias (parooliga). Ilma selleta resolveerub medusa 'redis' mailcow redisesse
    # → NOAUTH → getCategories timeout → kogu sait aeglane (2026-06-04 juurpõhjus).
    networks:
      default:
        aliases:
          - xlmarket-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  meili:
    image: getmeili/meilisearch:v1.41
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
      MEILI_DB_PATH: /meili_data
    volumes:
      - xlmarket_meili:/meili_data
    expose:
      - "7700"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:7700/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # PgBouncer (transaction-mode) — multipleksib N medusa-replica app-ühendused
  # vähestele Postgres server-ühendustele. KOHUSTUSLIK >1 medusa-instantsiga
  # (2×DB_POOL_MAX 50 = 100 = pg max_connections; pgbouncer bounds <50 server-conn).
  pgbouncer:
    image: edoburu/pgbouncer:latest
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: xlmarket
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: xlmarket
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "1000"
      DEFAULT_POOL_SIZE: "50"
      MIN_POOL_SIZE: "10"
      RESERVE_POOL_SIZE: "10"
      AUTH_TYPE: scram-sha-256
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "5432"

  medusa:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment: &medusa-env
      NODE_ENV: production
      # B-cutover: DATABASE_URL → pgbouncer (transaction-mode multiplekser), et
      # mitu medusa-replicat jagaks <50 pg-server-conn (2×DB_POOL_MAX 50 = 100 = pg max).
      DATABASE_URL: postgres://xlmarket:${POSTGRES_PASSWORD}@pgbouncer:5432/xlmarket
      # Multi-instance: server-mode (HTTP-replicad EI jooksuta jobe) + jagatud
      # state (cache/events/workflow-engine/locking) KÕIK compose-redisele,
      # et N replicat + worker jagaks workflow/lock/event-state'i.
      MEDUSA_WORKER_MODE: server
      # xlmarket-redis = Coolify redis unikaalne alias (mitte 'redis', mis
      # kollideerub mailcow-võrgu redisega). Vt redis service kommentaari.
      REDIS_URL: redis://xlmarket-redis:6379
      CACHE_REDIS_URL: redis://xlmarket-redis:6379
      EVENTS_REDIS_URL: redis://xlmarket-redis:6379
      WE_REDIS_URL: redis://xlmarket-redis:6379
      LOCKING_REDIS_URL: redis://xlmarket-redis:6379
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}
      MEILISEARCH_HOST: http://meili:7700
      MEILISEARCH_API_KEY: ${MEILISEARCH_API_KEY}
      MEILISEARCH_ADMIN_KEY: ${MEILISEARCH_API_KEY}
      MEILISEARCH_KEY: ${MEILISEARCH_API_KEY}
      SKIP_MEILISEARCH_STARTUP_INDEXING: ${SKIP_MEILISEARCH_STARTUP_INDEXING:-true}
      STORE_CORS: ${STORE_CORS}
      ADMIN_CORS: ${ADMIN_CORS}
      AUTH_CORS: ${AUTH_CORS}
      MEDUSA_ADMIN_PASS: ${MEDUSA_ADMIN_PASS:-}
      # ---- Email (SMTP relay via local Mailcow smarthost) ----
      # Requires medusa to be on the mailcow network (see networks: below).
      # Mailcow relays out; sender info@xlmarket.ee is whitelisted via sender_acl
      # (server@xlrent.eu allowed to send as info@xlmarket.ee).
      SMTP_HOST: ${SMTP_HOST:-mail.xlrent.eu}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-server@xlrent.eu}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      EMAIL_FROM: ${EMAIL_FROM:-info@xlmarket.ee}
      EMAIL_ADMIN: ${EMAIL_ADMIN:-tarmo@naissaar.eu}
      EMAIL_INVOICE: ${EMAIL_INVOICE:-tarmo@naissaar.eu}
      STORE_URL: ${NEXT_PUBLIC_BASE_URL:-https://xlmarket.ee}
    networks:
      default:
        # Stabiilne alias (prod=xlmarket-medusa, staging=eraldi env) → manuaalne
        # Traefik route (admin.xlmarket.ee) ei vaja konteineri-rename uuendust
        # iga redeploy järel. Default '-unset' väldib prod/staging kollisiooni.
        aliases:
          - ${MEDUSA_ALIAS:-xlmarket-medusa-unset}
      mailcow:
    depends_on:
      pgbouncer:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      meili:
        condition: service_healthy
    expose:
      - "9000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      # Medusa cold-boot takes ~373s on this catalog (observed: duration 373532ms).
      # start_period must exceed that or Coolify marks the deploy failed ("medusa unhealthy")
      # and leaves storefront in Created. 600s gives a safe margin.
      start_period: 600s

  # VARIANT D (2026-06-09): pgbouncer + 1 medusa + worker (TEADLIKULT ilma 2. web-
  # replikata — selle väärtus tõestamata, k6 Sammas 5; host ei mahuta multi-boot'i).
  # pgbouncer JÄÄB (bounds conn + valmis tuleviku 2.-node skaleerimiseks).
  #
  # medusa-worker = taustatööd (MEDUSA_WORKER_MODE=worker) → medusa-web ei jooksuta jobe.
  # STAGGERED: sleep 900 → worker npm-boot algab PÄRAST medusa healthy't (~810s) → ainult
  # ÜKS raske boot korraga (host-sõbralik, ei overload'i, dry-run §18 õppetund). Konteiner
  # luuakse kohe (deploy ei timeout — depends_on EI medusa:healthy). start_period 2100s
  # katab sleep(900)+boot(~810)+varu → "starting" mitte "unhealthy" sleep'i ajal.
  medusa-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *medusa-env
      MEDUSA_WORKER_MODE: worker
    command: ["sh", "-c", "sleep 900 && npm run start"]
    networks:
      default:
      mailcow:
    depends_on:
      pgbouncer:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      meili:
        condition: service_healthy
    expose:
      - "9000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:9000/health"]
      interval: 30s
      timeout: 15s
      retries: 6
      start_period: 2100s

  storefront:
    build:
      context: ./storefront
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_MEDUSA_URL: http://medusa:9000
        NEXT_PUBLIC_MEDUSA_KEY: ${NEXT_PUBLIC_MEDUSA_KEY}
        NEXT_PUBLIC_REGION_ID: ${NEXT_PUBLIC_REGION_ID}
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL}
        NEXT_PUBLIC_MEILI_URL: ${NEXT_PUBLIC_MEILI_URL}
        NEXT_PUBLIC_MEILI_KEY: ${NEXT_PUBLIC_MEILI_KEY}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_MEDUSA_URL: http://medusa:9000
      NEXT_PUBLIC_MEDUSA_KEY: ${NEXT_PUBLIC_MEDUSA_KEY}
      NEXT_PUBLIC_REGION_ID: ${NEXT_PUBLIC_REGION_ID}
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL}
      NEXT_PUBLIC_MEILI_URL: ${NEXT_PUBLIC_MEILI_URL}
      NEXT_PUBLIC_MEILI_KEY: ${NEXT_PUBLIC_MEILI_KEY}
      # Server-side (SSR) Meili calls go over the internal Docker network.
      # MEILISEARCH_HOST is read by lib/meilisearch.ts, lib/verticals.ts, api/muuja.
      # MEILI_INTERNAL_URL is read by the xl-admin categorization-queue page.
      MEILISEARCH_HOST: http://meili:7700
      MEILI_INTERNAL_URL: http://meili:7700
      NEXT_PUBLIC_DEFAULT_REGION: ee
    depends_on:
      medusa:
        condition: service_started
    networks:
      default:
        # Stabiilne alias (prod=xlmarket-storefront) → dev.xlmarket.ee Traefik
        # route ei vaja konteineri-rename uuendust iga redeploy järel.
        aliases:
          - ${STOREFRONT_ALIAS:-xlmarket-storefront-unset}
    expose:
      - "3030"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3030/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  xlmarket_pgdata:
  xlmarket_redis:
  xlmarket_meili:

networks:
  default:
  # Mailcow's network — medusa joins it to reach the SMTP relay (mail.xlrent.eu).
  # NB: on Coolify redeploy verify medusa is attached; if Coolify strips external
  # networks, run: docker network connect mailcowdockerized_mailcow-network <medusa-container>
  mailcow:
    external: true
    name: mailcowdockerized_mailcow-network
