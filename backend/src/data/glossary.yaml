# glossary.yaml — EN → ET tõlke-glossary (SSoT, HARD RULE #5)
#
# EESMÄRK: ühtne terminoloogia sisu-/tõlke-generaatorile. Üks EN-termin =
# üks kanooniline ET-vaste (hiljem RU/DE). Generaator LOEB seda; glossary EI ole
# per-toote transform, vaid viide-SSoT, mille vastu generaatori väljundit kontrollitakse.
#
# STRUKTUUR (üks EN-SSoT, N sihtkeelt — RU/DE = uus võti samale reale):
#   - en:      lähtemõiste (kanooniline vorm)
#     et:      eesti vaste (lukus)
#     freq:    tootearv (title+desc+sp+rich, korpus ~17446) — prioriteet
#     cluster: tööriistad | tehniline | materjalid | ühikud | turundus
#     status:  locked (lukus, kasuta) | review (ootab otsust)
#     aliases: [valikuline] muud EN-kirjapildid, mis mappivad samale et-vastele
#
# JÕUSTUS: generaatori väljundil glossary-adherence kontroll (kanoonilised terminid
# kasutusel? violation → review-bucket/skip, fail-loud). Uue termini tuvastus →
# propose-not-create review-bucket, MITTE auto-lisa.
#
# ⚠️ MATCH-JÄRJEKORD = LONGEST-MATCH-FIRST (kohustuslik): mitmesõnaline fraas ENNE
#    lühemat. Nt "hardware mounting" → kruvikinnitus PEAB matchima enne "hardware"
#    → tarvikud, muidu spetsiifiline fraas lipsab üldreegli alla. Sama "steam room
#    generator" vs "steam generator" jne. Adherence-kontroll sordib EN pikkuse järgi kahanevalt.
#
# STATUS: locked = otsustatud + rakendub (sagedus > 0). defer = vaste otsustatud, aga
#    sagedus 0 (ükski praegune toode ei kasuta) → aktiveerub, kui feed toob sellise toote.
#
# Allikas: ai-translation-trial/glossary-v1-review.md (2026-06-13 Opus judge-pass, 186 kand.)
# Batch 1 lukustatud 2026-08-24 (Tarmo otsused, kõrgeim sagedus).

