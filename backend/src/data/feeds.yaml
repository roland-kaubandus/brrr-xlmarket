# feeds.yaml — multi-feed registry (SSoT feedide kohta)
# Vt arhitektuur: outputs/multi-feed-plaan-2026-06-04.md
# Uue feedi lisamine = 1 blokk siia + 1 adapter (backend/src/feeds/adapters/<id>.mjs)
#   + 1 mapping-fail (backend/src/taxonomy/<id>-to-v3.json). EI muuda pipeline'i.
version: 1
updated: '2026-06-04'

defaults:
  markup: 1.15                 # algne_hind * 1.15 (käibemaks)
  currency: eur
  status_on_import: published  # või 'draft' kui vaja review enne avaldamist

feeds:
  - id: vevor
    name: VEVOR
    enabled: true
    format: xlsx
    url: https://ads-feed.s3.us-west-2.amazonaws.com/ads/business/571/vevor-571.xlsx
    local_path: backend/data/feeds/vevor-571.xlsx
    sku_prefix: VV             # supplier_sku = "VV-<raw_sku>" (kollisioonivaba)
    mapping: vevor-to-v3.json  # tarnija kategooria → kureeritud taxonomy
    adapter: vevor             # backend/src/feeds/adapters/vevor.mjs
    markup: 1.15
    brand_lock: VEVOR          # bränd jääb muutmata
    image_source: vevor_cdn    # pildid feedist (image.vevor.com) — ei hosti ise

  # --- Tulevased feedid (näidis, enabled:false kuni valmis) ---
  - id: powermat
    name: Powermat
    enabled: false             # ANALÜÜS valmis, import EI ole veel lubatud
    format: xml
    url: http://powermat-hurt.pl/uploads/soteshopxml.xml
    local_path: backend/data/feeds/powermat.xml
    sku_prefix: PM             # supplier_sku = "PM-<code>" (nt PM-PM0013)
    mapping: powermat-to-v3.json  # TEGEMATA — poola kat → kureeritud taxonomy
    adapter: powermat
    brand_lock: Powermat
    image_source: powermat
    # ⚠ Powermat ERISUSED (vt analüüs):
    currency: pln              # hinnad PLN-is
    currency_rate: 0.23        # 1 PLN = 0.23 EUR (FIKSEERITUD, uuenda KÄSITSI kord kuus)
    markup: 1.15               # PLN→EUR (×0.23) JÄREL: × 1.15 → lõpphind
    price_basis: wholesale_net # wholesale group-a netto (ostuhind), ilma 23% PL VAT
    language: pl               # nimi+kirjeldus poola keeles → ET-tõlge pipeline'is
    # Lõpphind = price_pln × 0.23 (EUR) × 1.15 (markup). Adapter teeb ×0.23, pipeline ×1.15.
    # ~1882 toodet, 1027 laos, 8 L1-kategooriat (CZĘŚCI/WARSZTAT/ELEKTRONARZĘDZIA...)
