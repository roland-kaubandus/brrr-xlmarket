# XLMarket taxonomy — Single Source of Truth
# Spec: docs/superpowers/specs/2026-04-18-taxonomy-final-design.md §3
# Generated artifacts: storefront/lib/branches.ts, taxonomy_node DB, MegaMenu,
# sitemap, Meili taxonomy fields, slug_redirect table.
#
# Rules (§3.4):
#   - slugs: English, kebab-case, max 5 tokens
#   - globally unique across tree
#   - reserved prefixes (not usable as L1/L2/L3 slug):
#       /alustajale/, /hooldus/, /arikliendile/, /toode/, /haru/
#   - L2: 4-8 per L1; L3: 0-12 per L2 (physical in DB only when >50 products
#     OR vertical kit requires the distinction)
#
# Classification (§3.1.1) — A/B/C for low-product L1s:
#   A — STRATEGIC    : stays visible, invest in resolver rules
#   B — MAINTAIN     : stays visible, no active growth
#   C — HIDE         : showInMegaMenu: false until product_count >= 30
#   (empty class = normal high-product L1)
#
# Research anchors: docs/research/2026-04-15-b2b-market-research.md
# Decision log: §12 Risto 6 decisions (2026-04-18)

version: 1
updated: 2026-04-18
