# =============================================================================
# VERTICALS (Faas 4) — spec §4
# =============================================================================
# Vertical = curated landing (JTBD) that crosses L1/L2 boundaries.
# Mode: alustajale | arikliendile | hooldus
# Each vertical materializes into vertical_collection + vertical_collection_product
# via backend/scripts/materialize-verticals.mjs. Products get
# meili_doc.vertical_slugs = ["alustajale:kohvik", ...]
#
# Structure per vertical:
#   slug, name_et/en, tagline_et/en, description_et/en
#   hero_img, emtak_codes (EE), cnae_codes (ES, future)
#   include_nodes: L1/L2/L3 slugs whose products belong to this vertical
#   exclude_nodes: (optional) slugs to carve out
#   kits: 3 tiers (starter / pro / enterprise) — 4-8 kit items each
#     each kit item: label, l2_slug (or l3), median_price_hint (optional)
#   faq: 5-8 {q, a} pairs
#   delivery_note, financing_note
#
# Materialization: scripts/materialize-verticals.mjs (nightly cron)

verticals:

  # ==========================================================================
  # PILOT #1 — KOHVIK (café) — 554 products, 300-500/mo demand, SEO winner
  # ==========================================================================
  - slug: kohvik
    mode: alustajale
    name_et: "Kohviku avamine"
    name_en: "Opening a Café"
    tagline_et: "Avad kohviku. Siit saad köögiseadmed, mööbli ja tarvikud."
    tagline_en: "Opening a café. Everything from espresso machine to chairs, one order."
    description_et: "Täiskomplekt kohviku avamiseks: espressomasin, jahutid, mööbel, nõud. Üks arve, üks tarne, üks kontaktisik. Käibemaks 24% sisaldub."
    description_en: "Complete kit to open a café: espresso machine, refrigeration, furniture, service items. One invoice, one delivery. VAT 24% included."
    meta_title_et: "Kohviku avamise täiskomplekt — XLMarket"
    meta_description_et: "Kõik alustaval kohvikupidajal vajalik: espressomasin, jahutid, lett, lauad-toolid, nõud. Hind alates €8499. Käibemaks 24% sisaldub."
    hero_img: /images/verticals/kohvik-hero.png
    hero_gradient: "from-amber-950/80 via-amber-900/40 to-transparent"
    emtak_codes: ["56101", "56102", "56103"]
    cnae_codes: ["5610"]
    include_nodes:
      - horeca-food-service
      - commercial-refrigeration
      - commercial-cooking-equipment
      - bar-beverage-service
      - food-preparation-equipment
      - commercial-sinks-washdown
      - restaurant-furniture
      - restaurant-storage-shelving
    exclude_nodes: []
    kits:
      - tier: starter
        name_et: "Alustaja komplekt"
        name_en: "Starter Kit"
        price_from: 8499
        items:
          - { label_et: "2-grupi espressomasin", label_en: "2-group espresso machine", l2_slug: bar-beverage-service }
          - { label_et: "Kohviveski", label_en: "Coffee grinder", l2_slug: bar-beverage-service }
          - { label_et: "Külmik + vitriin", label_en: "Refrigerator + display case", l2_slug: commercial-refrigeration }
          - { label_et: "Ettevalmistuslaud valamuga", label_en: "Prep table with sink", l2_slug: commercial-sinks-washdown }
          - { label_et: "Jäämasin", label_en: "Ice machine", l2_slug: commercial-refrigeration }
          - { label_et: "Nõud: tassid, kannud, kandikud", label_en: "Cups, carafes, trays", l2_slug: bar-beverage-service }
      - tier: pro
        name_et: "Profi komplekt"
        name_en: "Pro Kit"
        price_from: 14900
        items:
          - { label_et: "3-grupi espressomasin + kaks veskit", label_en: "3-group espresso + two grinders", l2_slug: bar-beverage-service }
          - { label_et: "Soojaturuklaas-vitriin", label_en: "Heated display case", l2_slug: commercial-cooking-equipment }
          - { label_et: "Kombi-ahi (saiade jaoks)", label_en: "Combi oven (for pastries)", l2_slug: commercial-cooking-equipment }
          - { label_et: "Tööstuslik nõudepesumasin", label_en: "Commercial dishwasher", l2_slug: commercial-sinks-washdown }
          - { label_et: "Lett + baaritoolid + lauad (12 kohta)", label_en: "Counter, bar stools, tables (12 seats)", l2_slug: restaurant-furniture }
          - { label_et: "Külmkapp + sügavkülmik tagaruumi", label_en: "Reach-in fridge + freezer", l2_slug: commercial-refrigeration }
      - tier: enterprise
        name_et: "Täiskohvik"
        name_en: "Full Café"
        price_from: 24500
        items:
          - { label_et: "Professionaalne espressomasin + kaks veskit + filtrikohvimasin", label_en: "Pro espresso + grinders + filter machine", l2_slug: bar-beverage-service }
          - { label_et: "Mitmerealiseeritud külmlett (2m)", label_en: "Multi-deck refrigerated counter (2m)", l2_slug: commercial-refrigeration }
          - { label_et: "Kombi-ahi + pitsaahi", label_en: "Combi oven + pizza oven", l2_slug: commercial-cooking-equipment }
          - { label_et: "Hood + ventilatsioon", label_en: "Hood + ventilation", l2_slug: kitchen-hvac-air-curtains }
          - { label_et: "Saali sisustus (20-30 kohta)", label_en: "Dining room furniture (20-30 seats)", l2_slug: restaurant-furniture }
          - { label_et: "Riiulid laos", label_en: "Back-of-house shelving", l2_slug: restaurant-storage-shelving }
    faq:
      - q_et: "Kas Vevor espressomasinad on HoReCa-kõlblikud?"
        a_et: "Jah. Vevor 2- ja 3-grupi masinad on CE-sertifitseeritud äriks. Paigaldame 3-faasi 400V nõuetega, vajalik sobiv elektrikilp. Garantii 24 kuud."
      - q_et: "Mis on 3-faasi nõuded?"
        a_et: "Enamus professionaalsest kuumseadmest (espressomasin 3+, ahi, nõudepesumasin) vajab 3-faasi 400V, 16A või 32A pistikut. Kontrolli oma lepingut Eleringiga enne avamist. Meie saadame tehnilise specifikatsiooni ette."
      - q_et: "HACCP — mida peab kohvikus jälgima?"
        a_et: "HACCP nõuab roostevaba teras pinnad, pestavad põrandad, eraldi käte pesu, toidutemperatuuri monitoring. Meie külmikud ja letid vastavad EL 852/2004. HACCP plaani koostamine jääb sulle või konsultandile."
      - q_et: "Kas tarnite + paigaldate?"
        a_et: "Tarne kogu Eesti mandril 3-7 tööpäeva. Paigaldame ise ainult Tallinna linnas. Mujal: toome kohale, juhendi + telefonitoe; elektriku + santehnika vajad eraldi tellida."
      - q_et: "Millal tasub alustada enterprise-kit'iga?"
        a_et: "Kui prognoosid >100 klienti/päev, avatud 12+ tundi, või pakud ka saiu/toitu. Alla selle: pro-kit on ülepakkumine. Võta ühendust, teeme custom quote'i."
      - q_et: "Kas käibemaks on hinnas sisse arvestatud?"
        a_et: "Jah, kõik hinnad sisaldavad Eesti käibemaksu 24%. Ettevõtetele: saad selle tagasi järgmises KMD'is (standardne korraldus)."
      - q_et: "Kas saan kasutada KredEx-i või MAK-i toetust?"
        a_et: "KredEx stardilaen ja MAK Leader-meetmed on enamus algajate kohvikute puhul rakendatavad. Arve ja toote-specifikatsioon sobivad mõlemale. Vajadusel saadame lisaandmeid."
    delivery_note_et: "Tavaline tarne Eestis: 4.99€ (vajab lisaks eriveerit raskete seadmete puhul). Paigaldame Tallinnas, mujal juhendame. Tagastamine 14 päeva, ainult avamata."
    financing_note_et: "Kõik hinnad sisaldavad käibemaksu 24%. Ärikliendile net-30 pärast kinnitamist (vaata /arikliendile). KredEx + MAK dokumendid saadame e-mailiga, kui vaja."

