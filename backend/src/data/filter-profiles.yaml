# filter-profiles.yaml — per-category adaptive filter definitions.
#
# Profile keys MUST match actual taxonomy slugs (L1 or L2). Matching is
# done most-specific-first in `filter-profiles.mjs`:
#   L2 slug -> L1 slug -> `_fallback`
#
# Spec keys emitted by backend/src/filters/spec-extractor.mjs:
#   voltage_v, amperage_a, pressure_bar, power_w, capacity_l,
#   flow_lmin, rpm, btu, duty_cycle_pct, frequency_hz,
#   weight_kg, length_cm, width_cm, height_cm,
#   brand, fuel, material

# Baseline filters applied to every category unless overridden
_defaults:
  filters:
    - { key: brand, type: keyword, label: "Brand" }
    - { key: price, type: price, label: "Price" }
    - { key: in_stock, type: boolean, label: "In Stock" }

# ══════════════════════════════════════════════════════════════════════
# L2 SLUG PROFILES (most specific — match first)
# ══════════════════════════════════════════════════════════════════════

welding-and-soldering:
  extends: _defaults
  filters:
    - { key: voltage_v, type: discrete, label: "Voltage", unit: V, buckets: [110, 220, 380] }
    - { key: amperage_a, type: range, label: "Amperage", unit: A, buckets: [[0, 100], [100, 200], [200, 300], [300, null]] }
    - { key: duty_cycle_pct, type: range, label: "Duty Cycle", unit: "%", buckets: [[0, 40], [40, 60], [60, 100]] }
    - { key: weight_kg, type: range, label: "Weight", unit: kg, buckets: [[0, 10], [10, 25], [25, 50], [50, null]] }

