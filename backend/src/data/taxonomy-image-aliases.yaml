# Taxonomy image alias map
# Spec 2026-04-18 §3.5 image resolution, step 2 (alias).
#
# When a v3 handle has no matching /cat-thumbs/<handle>.webp on disk, this
# file maps it to a legacy VEVOR slug whose image is visually appropriate.
# Each alias is a manual, reviewed editorial pick — NOT autogenerated.
#
# When nano-banana generates a proper v3 image for <handle>, just drop the
# file into public/cat-thumbs/<handle>.webp and delete the alias here.
#
# Format:
#   <v3-handle>: <legacy-slug>
#
# scripts/gen-category-tree.mjs reads this during tree generation; the
# resulting image_source in category-tree.generated.json will be "alias".

